<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Criador de Perguntas para Stories</title>
<meta name="description" content="Crie caixinhas de pergunta recebida no estilo Instagram e exporte em PNG.">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app">

  <header class="topbar">
    <h1>Criador de Perguntas</h1>
    <div class="topbar-actions">
      <button type="button" class="btn btn-ghost" id="btnClear">Limpar</button>
    </div>
  </header>

  <main class="layout">

    <!-- ============ PREVIEW ============ -->
    <section class="preview" aria-label="Pré-visualização">
      <div class="format-bar" id="formatBar" role="group" aria-label="Formato">
        <button type="button" class="seg" data-format="story">Story<small>1080×1920</small></button>
        <button type="button" class="seg" data-format="vertical">Vertical<small>1080×1350</small></button>
        <button type="button" class="seg" data-format="square">Quadrado<small>1080×1080</small></button>
        <button type="button" class="seg" data-format="box">Só a caixinha<small>Transparente</small></button>
      </div>

      <div class="stage" id="stage">
        <canvas id="canvas" width="1080" height="1920"></canvas>
      </div>

      <p class="stage-hint" id="stageHint">Arraste a caixinha no preview para reposicionar.</p>
    </section>

    <!-- ============ EDITOR ============ -->
    <section class="editor" aria-label="Editor">

      <div class="card main-fields">
        <div class="field">
          <label for="headerText">Texto do topo <span class="opt">cabeçalho da caixinha</span></label>
          <textarea id="headerText" rows="2" maxlength="200"
            placeholder="Ex: Faça uma pergunta">Faça uma pergunta</textarea>
        </div>

        <div class="field">
          <label for="pergunta">Pergunta recebida</label>
          <textarea id="pergunta" rows="2" maxlength="300"
            placeholder="Ex: Quanto custa o tratamento?"></textarea>
        </div>

        <div class="field">
          <label for="resposta">Resposta <span class="opt">opcional</span></label>
          <textarea id="resposta" rows="2" maxlength="400"
            placeholder="Ex: A partir de R$ 199 — te explico tudo no direct."></textarea>
        </div>
      </div>

      <details class="panel">
        <summary>Caixinha</summary>
        <div class="panel-body">
          <div class="field row">
            <label for="headerColor">Cor do cabeçalho</label>
            <input type="color" id="headerColor" value="#262626">
          </div>
          <div class="field row">
            <label for="bodyColor">Cor do corpo</label>
            <input type="color" id="bodyColor" value="#FFFFFF">
          </div>
          <div class="field row">
            <label for="headerTextColor">Cor do texto superior</label>
            <input type="color" id="headerTextColor" value="#C7C7C7">
          </div>
          <div class="field row">
            <label for="qColor">Cor da pergunta</label>
            <input type="color" id="qColor" value="#262626">
          </div>
          <div class="field">
            <label for="cardWidth">Largura <b class="val" id="cardWidthVal">82%</b></label>
            <input type="range" id="cardWidth" min="40" max="100" value="82">
          </div>
          <div class="field">
            <label for="radius">Arredondamento <b class="val" id="radiusVal">54</b></label>
            <input type="range" id="radius" min="0" max="90" value="54">
          </div>
          <div class="field">
            <label for="scale">Tamanho geral <b class="val" id="scaleVal">100%</b></label>
            <input type="range" id="scale" min="50" max="150" value="100">
          </div>
          <label class="check">
            <input type="checkbox" id="shadow"> Sombra suave
          </label>
          <button type="button" class="btn btn-soft" id="btnCenter">Centralizar caixinha</button>
        </div>
      </details>

      <details class="panel">
        <summary>Texto do topo</summary>
        <div class="panel-body">
          <div class="field">
            <label for="hSize">Tamanho da fonte <b class="val" id="hSizeVal">38</b></label>
            <input type="range" id="hSize" min="16" max="80" value="38">
          </div>
          <div class="field">
            <label>Alinhamento</label>
            <div class="segmented" id="hAlign">
              <button type="button" class="seg" data-align="left">Esq.</button>
              <button type="button" class="seg" data-align="center">Centro</button>
              <button type="button" class="seg" data-align="right">Dir.</button>
            </div>
          </div>
          <label class="check">
            <input type="checkbox" id="hWrap" checked> Quebra automática de linha
          </label>
        </div>
      </details>

      <details class="panel">
        <summary>Pergunta</summary>
        <div class="panel-body">
          <div class="field">
            <label for="qSize">Tamanho da fonte <b class="val" id="qSizeVal">52</b></label>
            <input type="range" id="qSize" min="24" max="96" value="52">
          </div>
          <div class="field">
            <label>Alinhamento</label>
            <div class="segmented" id="qAlign">
              <button type="button" class="seg" data-align="left">Esq.</button>
              <button type="button" class="seg" data-align="center">Centro</button>
              <button type="button" class="seg" data-align="right">Dir.</button>
            </div>
          </div>
          <label class="check">
            <input type="checkbox" id="qWrap" checked> Quebra automática de linha
          </label>
        </div>
      </details>

      <details class="panel">
        <summary>Resposta</summary>
        <div class="panel-body">
          <div class="field">
            <label for="aSize">Tamanho da fonte <b class="val" id="aSizeVal">54</b></label>
            <input type="range" id="aSize" min="24" max="110" value="54">
          </div>
          <div class="field row">
            <label for="aColor">Cor</label>
            <input type="color" id="aColor" value="#FFFFFF">
          </div>
          <div class="field">
            <label>Alinhamento</label>
            <div class="segmented" id="aAlign">
              <button type="button" class="seg" data-align="left">Esq.</button>
              <button type="button" class="seg" data-align="center">Centro</button>
              <button type="button" class="seg" data-align="right">Dir.</button>
            </div>
          </div>
          <div class="field">
            <label>Posição</label>
            <div class="segmented" id="aPos">
              <button type="button" class="seg" data-pos="above">Acima</button>
              <button type="button" class="seg" data-pos="below">Abaixo</button>
              <button type="button" class="seg" data-pos="free">Livre</button>
            </div>
          </div>
        </div>
      </details>

      <details class="panel">
        <summary>Fundo</summary>
        <div class="panel-body">
          <div class="field">
            <div class="segmented" id="bgType">
              <button type="button" class="seg" data-bg="transparent">Transp.</button>
              <button type="button" class="seg" data-bg="solid">Cor</button>
              <button type="button" class="seg" data-bg="gradient">Gradiente</button>
              <button type="button" class="seg" data-bg="image">Imagem</button>
            </div>
          </div>
          <div class="field row" id="bg1Field" hidden>
            <label for="bgColor1">Cor</label>
            <input type="color" id="bgColor1" value="#6C4AE6">
          </div>
          <div class="field row" id="bg2Field" hidden>
            <label for="bgColor2">2ª cor</label>
            <input type="color" id="bgColor2" value="#FF6EC7">
          </div>
          <div class="field" id="bgAngleField" hidden>
            <label for="bgAngle">Direção do gradiente</label>
            <select id="bgAngle">
              <option value="vertical">Vertical</option>
              <option value="diagonal" selected>Diagonal</option>
              <option value="horizontal">Horizontal</option>
            </select>
          </div>
          <div class="field" id="bgImageField" hidden>
            <label for="bgImage">Imagem</label>
            <input type="file" id="bgImage" accept="image/*">
            <label class="check">
              <input type="checkbox" id="bgDim"> Escurecer imagem
            </label>
          </div>
        </div>
      </details>

    </section>

    <!-- ============ EXPORT ============ -->
    <section class="exportbar">
      <button type="button" class="btn btn-primary" id="btnDownload">Baixar PNG</button>
      <button type="button" class="btn btn-soft" id="btnDownloadBox">Baixar somente a caixinha</button>
      <span class="size-tag" id="sizeTag">1080 × 1920</span>
    </section>

  </main>
</div>

<script src="script.js"></script>
</body>
</html>
